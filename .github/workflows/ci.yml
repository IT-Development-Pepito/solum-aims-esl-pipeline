name: ci

on: [push, pull_request]

jobs:
  database-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: esl_ci
          POSTGRES_USER: esl_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esl_ci -d esl_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ESL_DATABASE_URL: postgresql+psycopg://esl_ci@localhost:5432/esl_ci
      ESL_TEST_DATABASE_URL: postgresql+psycopg://esl_ci@localhost:5432/esl_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest -v tests/integration tests/unit/persistence/test_migration_graph.py
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m pytest -v
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
