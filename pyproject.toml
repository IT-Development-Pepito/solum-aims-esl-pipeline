[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "solum-aims-esl-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "alembic", "pydantic-settings", "psycopg[binary]", "pyodbc", "httpx", "typer", "structlog", "pywin32; sys_platform == \"win32\"", "prometheus-client"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "respx"]

[project.scripts]
esl-admin = "esl_service.runtime.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
